# Continuous integration (B-13). No API key is used or needed: the tests replace the model and the
# embedding model with fakes, and the README smoke run stops after routing (--no-generate).
name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Lint and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          # The default PyPI build of torch pulls ~2.5 GB of GPU libraries; the CPU build is enough here.
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu \
            || echo "CPU wheel not available - falling back to PyPI"
          pip install -r requirements.txt

      - name: Lint (flake8)
        run: flake8

      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term

  readme-smoke:
    name: README steps 3, 4 and 8 (setup + unattended run, no model calls)
    runs-on: ubuntu-latest
    needs: tests
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies (CPU-only PyTorch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.15.0 --index-url https://download.pytorch.org/whl/cpu \
            || echo "CPU wheel not available - falling back to PyPI"
          pip install -r requirements.txt

      - name: Step 3 - configuration from .env.example
        run: cp .env.example .env

      - name: Step 4 - one-time setup (downloads the embedding model, builds index and classifier)
        run: python -m scripts.setup

      - name: Step 8 - unattended run on the validation set (routing only)
        run: python -m evaluation.harness --input data/validation_tickets.json --output evaluation/results/ --no-generate

      - name: Example tickets (routing only)
        run: python -m evaluation.harness --input examples/all_examples.json --output evaluation/results/ --no-generate

      - name: Keep the metrics reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-run-reports
          path: evaluation/results/run_*/metrics.md
          if-no-files-found: ignore
